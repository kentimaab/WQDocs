# Script dependency map — single source of truth.
# Each key is a script name; the value is its list of direct dependencies.
# This file is read by hooks/script_deps.py to auto-generate Requirements
# admonitions on get-started pages. Update this file when dependencies change.
# add your script. Enters the scripts that you know you used, and the tree, will
# handel the full dependencies.
# Exampel: scMyscript: [scAlert, scLinking, scNav]
# Result in tree: scMyscript: [scAler, scLinking, scPrototypes, scSubNav, scUser ,scSuffix ,scObjectFinder,scThemes]
#
# Only DIRECT dependencies belong here. Note that a dependency is not always a
# `scFoo.` call: several scripts publish bare globals (scQuickSort/Quicksort,
# scPrototypes/arraySortInPlace, scCalendar/CalendarService, scDatabase/dbQueryObj,
# scHistory/HistoryHandler, scSubNav/subNav), and calling one of those is just as
# much a dependency. Grep the bare name, not only the namespace.
#
# Optional, guarded references are deliberately NOT listed: scCalendar reads
# scHoliday only behind `typeof scHoliday !== "undefined"` and works without it,
# while scHoliday hard-depends on scCalendar's CalendarService. Listing both
# directions would create a cycle, and _get_layer() recurses without a visited
# set, so a cycle crashes the build rather than degrading.

# Layer 0, no dependencies
scAlert: []
b64: []
scKeybindings: []
scModem: []
scOSK: []
